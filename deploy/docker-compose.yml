# Formulário de Diagnóstico Escolar — app + PostgreSQL, tudo em containers.
# Uso (a partir da pasta extraída):
#   docker compose -f deploy/docker-compose.yml up -d --build
# Depois acesse http://localhost:8080  (login inicial: admin / admin123)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: diagnostico
      POSTGRES_PASSWORD: TROQUE_ESSA_SENHA
      POSTGRES_DB: diagnostico
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://diagnostico:TROQUE_ESSA_SENHA@db:5432/diagnostico?sslmode=disable
      PORT: "8080"
      DATA_DIR: /dados
      TZ: America/Sao_Paulo
    ports:
      - "8080:8080"
    volumes:
      - uploads:/dados

volumes:
  pgdata:
  uploads:
